services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    # scripts/start_api.sh runs `alembic upgrade head` and then `exec uvicorn app.main:app` once before Uvicorn forks workers.
    command: ["sh", "/app/scripts/start_api.sh"]
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ESTATES_ENABLED: ${ESTATES_ENABLED:-true}
      ESTATE_PUBLIC_MAP: ${ESTATE_PUBLIC_MAP:-true}
      PROMETHEUS_MULTIPROC_DIR: /var/lib/landcheck/prometheus
    volumes:
      - prometheus_multiproc:/var/lib/landcheck/prometheus
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  metrics-exporter:
    build: .
    command: ["python", "-m", "app.metrics_exporter"]
    init: true
    environment:
      PROMETHEUS_MULTIPROC_DIR: /var/lib/landcheck/prometheus
      METRICS_EXPORTER_HOST: 0.0.0.0
      METRICS_EXPORTER_PORT: 9101
    volumes:
      - prometheus_multiproc:/var/lib/landcheck/prometheus:ro
    networks:
      landcheck_monitoring:
        aliases:
          - landcheck-metrics-exporter
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  prometheus_multiproc:

networks:
  landcheck_monitoring:
    name: ${LANDCHECK_MONITORING_NETWORK:-landcheck-monitoring_monitoring}
    external: true
