# Merge this scrape job into the existing Prometheus configuration. Prometheus
# must be attached to LANDCHECK_MONITORING_NETWORK; the exporter port is not
# published on the Hetzner host.
scrape_configs:
  - job_name: landcheck-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - landcheck-metrics-exporter:9101
        labels:
          service: landcheck-api
