name: Deploy to Hetzner
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            set -eu
            cd /root/landcheck-api
            git fetch origin main
            if [ -n "$(git status --porcelain)" ]; then
              # A previous release may have left generated, tracked artifacts removed from the
              # worktree. If the resulting worktree already matches the fetched main tree, it is
              # safe to reconcile it with the fast-forward below; real source drift still stops
              # the deployment. Never auto-stash or overwrite an untracked production file.
              if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "Refusing deployment: production checkout has untracked files." >&2
                git status --short >&2
                exit 1
              fi
              if ! git diff --quiet origin/main --; then
                echo "Refusing deployment: production checkout has changes not present in origin/main." >&2
                git status --short >&2
                git diff --stat origin/main -- >&2 || true
                exit 1
              fi
              echo "Production worktree already matches origin/main; reconciling the checkout." >&2
            fi
            if [ "$(git branch --show-current)" != "main" ]; then
              git switch main
            fi
            git merge --ff-only origin/main
            docker compose up -d --build
      - name: Verify production resources and API health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            set -eu
            printf 'CPU cores: '
            nproc
            printf '\nMemory:\n'
            free -m
            printf '\nRoot filesystem:\n'
            df -h /
            printf '\nCompose services:\n'
            cd /root/landcheck-api
            docker compose ps
            printf '\nContainer usage:\n'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true
            printf '\nAPI health:\n'
            health_check() {
              if command -v curl >/dev/null 2>&1; then
                curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/health/
              else
                docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=10).read().decode())"
              fi
            }
            attempt=1
            until health_check; do
              if [ "$attempt" -ge 12 ]; then
                echo "API health did not become ready after ${attempt} attempts" >&2
                exit 1
              fi
              sleep 5
              attempt=$((attempt + 1))
            done
            printf '\n'
