name: Deploy to Hetzner
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            set -eu
            cd /root/landcheck-api
            git fetch origin main
            target_ref="$(git rev-parse FETCH_HEAD)"
            echo "Deploying fetched commit: $target_ref"
            if [ -n "$(git status --porcelain)" ]; then
              # A previous release may have left generated, tracked artifacts removed from the
              # worktree. Compare only actual local edits against the incoming commit: the old
              # checkout will naturally differ from origin/main in every changed source file
              # before the fast-forward. Never auto-stash or overwrite an untracked production file.
              if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "Refusing deployment: production checkout has untracked files." >&2
                git status --short >&2
                exit 1
              fi
              local_files="$(git diff --name-only; git diff --cached --name-only | sort -u)"
              incoming_files="$(git diff --name-only HEAD "$target_ref")"
              for path in $local_files; do
                if ! printf '%s\n' "$incoming_files" | grep -Fxq -- "$path"; then
                  echo "Refusing deployment: local production change is not part of origin/main: $path" >&2
                  git status --short >&2
                  exit 1
                fi
                if ! git diff --quiet "$target_ref" -- "$path"; then
                  echo "Refusing deployment: local production content differs from origin/main: $path" >&2
                  git status --short >&2
                  exit 1
                fi
              done
              echo "Production local changes match the incoming commit; reconciling the checkout." >&2
            fi
            if [ "$(git branch --show-current)" != "main" ]; then
              git switch main
            fi
            git merge --ff-only "$target_ref"
            docker compose up -d --build
      - name: Verify production resources and API health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            set -eu
            printf 'CPU cores: '
            nproc
            printf '\nMemory:\n'
            free -m
            printf '\nRoot filesystem:\n'
            df -h /
            printf '\nCompose services:\n'
            cd /root/landcheck-api
            docker compose ps
            printf '\nContainer usage:\n'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true
            printf '\nAPI health:\n'
            health_check() {
              if command -v curl >/dev/null 2>&1; then
                curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/health/
              else
                docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=10).read().decode())"
              fi
            }
            attempt=1
            until health_check; do
              if [ "$attempt" -ge 12 ]; then
                echo "API health did not become ready after ${attempt} attempts" >&2
                exit 1
              fi
              sleep 5
              attempt=$((attempt + 1))
            done
            printf '\n'
