name: Deploy to Hetzner
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            cd /root/landcheck-api
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker system prune -f
      - name: Verify production resources and API health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ""
          script: |
            set -eu
            printf 'CPU cores: '
            nproc
            printf '\nMemory:\n'
            free -m
            printf '\nRoot filesystem:\n'
            df -h /
            printf '\nCompose services:\n'
            cd /root/landcheck-api
            docker compose ps
            printf '\nContainer usage:\n'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
            printf '\nAPI health:\n'
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/health/
            printf '\n'
