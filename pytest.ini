[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    postgis: requires LANDCHECK_POSTGIS_TEST_DATABASE_URL, a disposable PostgreSQL/PostGIS database migrated to head
    storage: requires LANDCHECK_MINIO_TEST_ENDPOINT and development-only MinIO credentials
    estate_rls: requires ESTATE_RLS_TEST_DATABASE_URL, a disposable PostgreSQL database migrated to head
